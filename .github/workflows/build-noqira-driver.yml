name: Build NOQIRA Driver APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOQIRA Driver branch
        uses: actions/checkout@v4
        with:
          ref: noqira-driver-build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/NOQIRA-Driver-Prueba.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOQIRA-Driver-Prueba
          path: release/NOQIRA-Driver-Prueba.apk
          if-no-files-found: error
